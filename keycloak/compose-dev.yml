name: medizano-keycloak-dev

services:
  keycloak-db:
    image: postgres:17-alpine
    container_name: medizano-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: medizano_keycloak
      POSTGRES_USER: medizano_keycloak
      POSTGRES_PASSWORD: medizano_keycloak_password
    ports:
      - "15436:5432"
    volumes:
      - medizano_keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medizano_keycloak -d medizano_keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: medizano-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/medizano_keycloak
      KC_DB_USERNAME: medizano_keycloak
      KC_DB_PASSWORD: medizano_keycloak_password
      KC_METRICS_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: 9000
    ports:
      - "18180:8080"
      - "19000:9000"
    depends_on:
      keycloak-db:
        condition: service_healthy

volumes:
  medizano_keycloak_db_data:
